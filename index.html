<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aldrin Jenson's Talks</title>
  <link rel="stylesheet" type="text/css" href="_website/styles.css">
</head>

<body>
  <div class="talk-container">
    <h1>Talks & Slides</h1>
    <p style="text-align: center;">Slides for some presentations and talks I've done. Added here for easy access and
      reference</p>

    <ol id="talkList" style="margin-top: 5%;">
      <!-- filled by JS -->
    </ol>

    <button class="toggle-btn" onclick="toggleTheme()">Toggle Theme</button>

    <script src="_website/content.js"></script>
    <script src="_website/script.js"></script>
    <script>
      const talkList = document.getElementById("talkList");
      talks.forEach(function (talk) {
        const listItem = createTalkEntry(talk.title, talk.link, talk.description, talk.tags, talk.date);
        talkList.appendChild(listItem);
      });
    </script>
  </div>
</body>

</html>
